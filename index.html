<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener('unhandledrejection', function (event) {
        var msg = event && event.reason && event.reason.message ? String(event.reason.message) : '';
        if (msg.indexOf('WebSocket closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
    <title>CampusFlow — Smart Campus Meeting & Navigation Assistant</title>
    <meta name="description" content="CampusFlow helps University of Waterloo faculty, staff, and researchers organize meetings, calculate realistic room-to-room travel times, and depart on time." />
    <meta property="og:title" content="CampusFlow — Smart Campus Meeting & Navigation Assistant" />
    <meta property="og:description" content="CampusFlow helps University of Waterloo faculty, staff, and researchers organize meetings, calculate realistic room-to-room travel times, and depart on time." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-blue-600 selection:text-white min-h-screen">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
